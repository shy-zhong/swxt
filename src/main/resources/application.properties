# ===== 应用配置文件 =====
# 数据源（MySQL）：库名 swxt，账号 manager，密码 20030923
# 服务端口 8887，统一上下文前缀 /api（前端 request.ts 中 BASE_URL 与此对应）
# JWT：密钥与有效期（毫秒，21600000 = 6 小时）
# MyBatis：开启下划线转驼峰，Mapper XML 位置 classpath:mapper/*.xml

spring.application.name=swxt
spring.datasource.url=jdbc:mysql://localhost:3306/swxt?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=manager
spring.datasource.password=20030923
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
server.port=8887
server.servlet.context-path=/api
jwt.secret=swxt-secret-key-only-is-used-for-six-hours
jwt.expiration=21600000
spring.security.user.name=admin
spring.security.user.password=admin

# 文件上传配置
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=info