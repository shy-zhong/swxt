# 项目级 Reasonix 配置(解析顺序: flag > ./reasonix.toml > 全局 config.toml)
# 全局 config.toml 的 [sandbox] workspace_root 指向安装目录,导致本工作区文件写入工具受限;
# 此处将可写根限定为当前工作区,仅影响本项目。
# 注意:配置在会话启动时加载,新增/修改后需重启 Reasonix 会话才生效。
# allow_write 除工作区外,额外放行桌面上的开发模块列表.md(用户明确要求维护此文件)。

[sandbox]
workspace_root = "."
allow_write = ["*", "D:/zyy/oneDrive/Desktop/开发模块列表.md"]
forbid_read = ["${HOME}/.ssh", "${HOME}/.aws"] 
# 本机工具路径(注入环境摘要供模型直接调用;路径用正斜杠避免 TOML 转义,重启会话生效)
[environment.tools]
mysql = "D:/Program Files/MySQL/MySQL Server 8.0/bin/mysql.exe"
java = "D:/Program Files/Java/jdk-17/bin/java.exe"
# 浏览器验证:本机无 Chrome,使用 Edge(browser-harness 连接 Edge 调试实例 + BU_CDP_URL)
edge = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
